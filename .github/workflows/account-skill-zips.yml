# Build one downloadable ZIP per account-store skill that needs re-uploading,
# so the upload can be done from a phone: download the artifact in Safari, then
# hand the same file to claude.ai Settings -> Capabilities.
#
# WHAT THIS CAN AND CANNOT KNOW
# A runner has no ~/.claude/skills/synced, so it cannot ask the account store
# anything (ADR 0002). It reads the COMMITTED recording, `account-state.json`
# at the REGISTRY ROOT beside skills.lock - never inside a skill directory,
# because zip_skill() uploads a skill's whole folder - written by
# `sync_skills.py --record-account-state` from a session that does have a
# mirror. So "needs upload" means "the registry moved since someone last
# looked at the account" - strong evidence, not proof. Re-record after
# uploading or the same skill keeps being offered.
#
# THE SECOND SOURCE, AND WHY IT IS THE SAME CONDITION THAT FILES THE ISSUE
# The recording above goes stale on its own. The one thing that actually LOOKS
# at the account store is skills-evals' Tier-3 Routine, which publishes
# `propagation/account/latest.json` to that repo's `eval-results` branch, and
# whose `reported-failure` verdict is what opens or updates the tracking issue
# "Account skill store drifted from registry (automated Tier-3 audit)"
# (`fresh` closes it). The `pick` job below clones that repo and calls
# skills-evals' OWN `account_store.freshness_verdict` on the published
# artifact, so the ZIPs appear under exactly the condition that files the
# issue - the report of the problem and the fix for it arrive together, and
# neither repo can quietly start using a different predicate.
#
# CONSEQUENCE, STATED SO IT IS NOT DISCOVERED AS A SURPRISE: this workflow now
# has a CROSS-REPO DEPENDENCY whose verdict can change with NO COMMIT IN THIS
# REPO AT ALL - the same property ci.yml's `skills-conformance` job has, and
# the reason both carry a schedule. The audit half is best effort: if the clone
# or the import fails the verdict is `unavailable`, the run continues on the
# local recording alone, and the summary says DEGRADED in words. It must never
# be possible to mistake "we could not ask" for "we asked and it passed".
#
# WHY THE ARTIFACT IS THE SKILL'S FILES AND NOT A .zip FILE
# GitHub hands you an artifact AS a zip named after the artifact, so an
# artifact named `sync-skills` downloads as `sync-skills.zip` with SKILL.md at
# its root - the exact shape `zip_skill()` uploads (SKILL.md at root,
# ZIP_STORED). `compression-level: 0` keeps it stored rather than deflated.
# Putting a .zip INSIDE the artifact would instead force an extract step on the
# phone, and a nested .zip would upload as part of the skill.
#
# NO `concurrency:` BLOCK, DELIBERATELY. It publishes no required status
# context, and a dispatch is a human asking for a build right now - grouping
# would let one dispatch cancel another's pending run. See AGENTS.md,
# "A required status check gets no `concurrency` group".
name: Account skill ZIPs

on:
  workflow_dispatch:
    inputs:
      selection:
        description: "stale (default) | all | comma-separated skill names"
        required: false
        default: stale
  # DAILY, BECAUSE THE CONDITION CAN BECOME TRUE WITH NO EVENT HERE. The
  # Tier-3 Routine publishes at about 05:04 UTC, but GitHub queues cron across
  # the whole platform and delays it by an unbounded amount, so no cron can be
  # "just after" that publish - aligning them exactly is not something this
  # side can arrange. That is precisely why the run reads the published
  # CONDITION (the artifact's own `generated_at`, judged by
  # `freshness_verdict`) instead of trusting the clock: an early run sees a
  # yesterday's-but-still-fresh result and says so, and a Routine that stopped
  # firing reads as `stale` rather than as a pass. :23 rather than :00 for the
  # queueing reason above, and offset from ci.yml's `17 6 * * *` so the two
  # daily jobs do not contend for the same runner minute.
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    # Salient paths only: the skills that can be declared, the recording that
    # decides staleness, the tool that computes it, the module that selects,
    # and this file.
    #
    # `account-state.json` is listed EXPLICITLY and is not covered by any glob
    # above it: the recording lives at the repo ROOT, deliberately (a copy
    # inside a skill directory would be uploaded as part of that skill by
    # `zip_skill()`), so it matches neither `plugins/*/skills/**` nor the
    # workflow path. Without this line, merging a `record-account-upload` PR -
    # whose diff is exactly and only that file - did not re-run this workflow,
    # so the offer list stayed stale until some unrelated push moved it.
    paths:
      - 'plugins/*/skills/**'
      - 'account-state.json'
      - 'scripts/account_zip_selection.py'
      - '.github/workflows/account-skill-zips.yml'

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.drift.outputs.names }}
      count: ${{ steps.drift.outputs.count }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Read the published account audit's verdict
        id: audit
        # WHY THIS IMPORTS skills-evals' FUNCTION INSTEAD OF RE-DERIVING IT
        # `freshness_verdict` is the ONE decision function over
        # propagation/account/latest.json, and the tracking issue named in this
        # file's header is opened, updated and closed by its result. A second
        # implementation here would be free to disagree with it: this workflow
        # would build ZIPs for a condition nobody filed, or stay silent while an
        # issue sat open, and nothing would report the divergence. So the
        # harness is cloned and its own function is called, with `max_age_days`
        # read from ITS fixture rather than copied into a constant here.
        #
        # Two clones because they want different things - blobless for the code,
        # single-branch for the published artifact - and both anonymous: the two
        # repos are public, which is the same reason ci.yml's sibling clones
        # need no token. Cloned to ../ so neither tree pollutes the workspace
        # checkout that `--account-drift` scans.
        #
        # THIS STEP RUNS UNDER `bash -e`, AND EVERY FAILURE THAT REACHES FOR
        # skills-evals IS EXPLICITLY GUARDED. Both facts are load-bearing, and
        # the first one is not a
        # choice made here: no `shell:` and no `defaults:` are declared
        # anywhere in this file, so GitHub runs each `run:` body as
        # `/usr/bin/bash -e {0}`. The `set -uo pipefail` below adds nounset and
        # pipefail to that; it cannot take errexit away, because `set -o` only
        # ENABLES options. This comment previously claimed the step ran without
        # `-e` "deliberately", which was false at runtime and is the more
        # dangerous direction to be wrong in: an editor who believes an
        # unguarded command fails soft here writes one, and it aborts the step
        # instead.
        #
        # What makes the tolerance real is the SHAPE of every failable command,
        # not the absence of a flag. Both clones sit in `if` conditions, and
        # the pyyaml install, the placeholder `mkdir`, the heredoc capture and
        # the drift-constant read sit in `||` lists - all constructs errexit is
        # defined not to act on, so each failure is caught by name and becomes
        # `status=unavailable`, which the summary renders as DEGRADED. Keep new
        # commands in one of those shapes. A missing `eval-results` branch in
        # particular is reported and never fatal - the same tolerance
        # skills-evals' own propagation.yml applies in "Fetch the account
        # audit's published result", and for the same reason: a hard failure
        # would take out the one workflow that hands a phone the fix for the
        # drift.
        #
        # THAT `mkdir` USED TO BE THE COUNTEREXAMPLE, and it sat in the one
        # branch the sentence above promises is never fatal. `mkdir -p
        # ../eval-results` fails when the path already exists as a FILE or the
        # parent is not writable, and unguarded that killed the step under
        # errexit before any verdict handling ran - so the missing-branch path
        # aborted the job instead of degrading, which is the exact failure the
        # comment was telling an editor could not happen here. It is a `||`
        # list now, and scripts/test_account_workflows.py executes that case
        # rather than reading this paragraph.
        #
        # ONE COMMAND IS DELIBERATELY LEFT UNGUARDED: the final `status=` write
        # to $GITHUB_OUTPUT. There is no degraded path to take when the runner
        # cannot write its own output file - the next step would read an absent
        # status and normalise it to `unavailable`, which is this file header's
        # "we could not ask" read as "we asked and it passed" one more time.
        # Aborting is the honest answer there, and it is the reason the
        # headline above says "reaches for skills-evals" rather than "every".
        run: |
          set -uo pipefail
          if git clone --filter=blob:none --depth 1 --quiet \
              https://github.com/Adam-S-Daniel/skills-evals.git ../skills-evals; then
            echo "skills-evals harness checked out"
          else
            echo "::warning::could not clone the skills-evals harness"
          fi
          if git clone --depth 1 --single-branch --branch eval-results --quiet \
              https://github.com/Adam-S-Daniel/skills-evals.git ../eval-results; then
            echo "eval-results checked out"
          else
            echo "::warning::eval-results branch not present yet"
            mkdir -p ../eval-results \
              || echo "no placeholder for the missing eval-results clone either; the verdict below reports it"
          fi
          python3 -m pip install --quiet pyyaml==6.0.3 \
            || echo "::warning::pyyaml install failed; unless it is already present the verdict will be unavailable"
          verdict=$(python3 - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "../skills-evals/harness")
          import yaml
          from propagation.account_store import freshness_verdict

          fixture = yaml.safe_load(Path(
              "../skills-evals/evals/propagation/fixture.yaml"
          ).read_text(encoding="utf-8"))
          latest = Path("../eval-results/propagation/account/latest.json")
          try:
              summary = json.loads(latest.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              summary = None
          ok, status, message = freshness_verdict(
              summary,
              now=datetime.now(timezone.utc),
              max_age_days=int(fixture["account_audit_max_age_days"]),
              bootstrapped=Path("../eval-results/propagation/.bootstrapped").exists(),
          )
          print(message, file=sys.stderr)
          print(status)
          PY
          ) || verdict=""
          # An empty capture is the ONLY way this can end without a verdict, and
          # it must not read as one. `unavailable` is not a skills-evals status;
          # the selection module treats it - and any string it does not
          # recognise - as "the audit could not be used".
          #
          # IT ALSO RAISES AN ANNOTATION, BECAUSE THIS IS THE ONE PATH THAT
          # FAILS OPEN. Every other failure in this step warns already, and
          # this was the one that did not - which is backwards, because it is
          # the one that fires when the cross-repo IMPORT breaks: skills-evals
          # moves `account_store.py`, renames `freshness_verdict`, or renames
          # the `account_audit_max_age_days` fixture key. Both clones then
          # succeed, neither warning above fires, the heredoc raises, and with
          # a clean local recording `count=0` skips the zip job - so the run
          # ends GREEN with zero annotations while the cross-repo half of the
          # evidence was never read. Nothing else reports it either:
          # scheduled-run-health.yml scans for FAILED runs, and this one did
          # not fail.
          if [ -z "$verdict" ]; then
            verdict=unavailable
            echo "::warning::could not compute the published account audit verdict - the clones can succeed while the import inside this step breaks (a moved module, a renamed function, a renamed fixture key in Adam-S-Daniel/skills-evals). This run used the local recording alone."
          fi
          echo "published account audit reads: $verdict"
          # THE LIVENESS VERDICTS GET AN ANNOTATION FOR THE SAME REASON. Each
          # of these means the Tier-3 Routine has stopped publishing a usable
          # result - a fault in the OTHER repo, which this run is the only
          # thing here positioned to notice, and which otherwise shows up only
          # inside a step summary nobody opens on a green run. Surfacing it as
          # an annotation puts it on the Actions list instead.
          #
          # The healthy answers stay quiet on purpose - `fresh`, the drift
          # verdict this workflow exists to react to, and `not-yet-bootstrapped`
          # (nothing has been published yet, which is a state and not a fault).
          # A warning on every run is a warning nobody reads. `unavailable` is
          # quiet HERE for a different reason: it is set in exactly one place,
          # the `if [ -z "$verdict" ]` branch a few lines up, which annotates it
          # as it sets it. Catching it below as well would put two annotations
          # on one fault, and a reader who learns the annotations are duplicated
          # stops counting them.
          #
          # AND THE CATCH-ALL, WHICH IS WHY THE HEALTHY ANSWERS ARE ENUMERATED
          # RATHER THAN LEFT TO FALL THROUGH. Without a `*)` arm a status this
          # repo has never heard of matched nothing, said nothing, and was
          # normalised to `unavailable` inside account_zip_selection.py - so the
          # audit contributed no names, the Degraded notice went only to the
          # step summary, and the run ended green with zero annotations while
          # the whole cross-repo half of the evidence went unused. That is this
          # file header's "we could not ask" read as "we asked and it passed",
          # arriving through the one door the empty-capture guard above cannot
          # cover: `$verdict` is not empty, it is just a word from a vocabulary
          # that moved. A skills-evals rename of the drift status is exactly
          # that shape, and nothing else here would report it - both clones are
          # green, the import is green, and scheduled-run-health.yml only scans
          # for FAILED runs.
          #
          # WHY THE DRIFT VERDICT IS READ FROM THE MODULE INSTEAD OF SPELLED IN
          # THE ARM. It is the predicate both repos key on, and this repo writes
          # it down exactly once - `AUDIT_DRIFT_STATUS` in
          # scripts/account_zip_selection.py - precisely so a rename cannot
          # update one copy and leave a second one behind; a non-comment line
          # here naming it fails scripts/test_account_workflows.py. So the quiet
          # arm imports it, which is also the more honest arrangement: the two
          # lists cannot disagree, because there is only one list. If that read
          # fails, `drift` is empty, the drift verdict falls to `*)` and warns
          # about a status that is in fact recognised - wrong, but loud, and it
          # cannot happen quietly: reading it fails only when the module cannot
          # be imported, and the very next step runs that same module under
          # `set -euo pipefail`, which reds the job.
          drift=$(PYTHONPATH=scripts python3 -c 'from account_zip_selection import AUDIT_DRIFT_STATUS as s; print(s)') || drift=""
          case "$verdict" in
            stale|missing|unreadable)
              echo "::warning::the published account audit reads '$verdict' - the Tier-3 Routine has not published a usable result recently, so this run leaned on the local recording. Check that Routine and the eval-results branch of Adam-S-Daniel/skills-evals." ;;
            fresh|not-yet-bootstrapped|unavailable|"$drift")
              : ;;
            *)
              echo "::warning::the published account audit reads '$verdict', which is not a status this repo knows - skills-evals' verdict vocabulary has moved under it. The audit contributed no skill names, so this run fell back to the local recording alone. Teach scripts/account_zip_selection.py the new name, and this step with it." ;;
          esac
          echo "status=$verdict" >> "$GITHUB_OUTPUT"
      - name: Decide which skills need a ZIP
        id: drift
        # SELECTION is read from the environment, never interpolated into the
        # run: body - an `${{ inputs.* }}` expansion is echoed into the log and
        # is attacker-controlled shell. See AGENTS.md, "Data exposure in CI".
        # AUDIT_STATUS and EVENT_NAME come the same way for the same reason.
        #
        # The decision itself lives in scripts/account_zip_selection.py rather
        # than in a heredoc here: it now takes the union of two sources, and a
        # rule that spans two repos has to be exercisable against fixtures. See
        # scripts/test_account_zip_selection.py.
        env:
          SELECTION: ${{ inputs.selection || 'stale' }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 plugins/adam-local/skills/sync-skills/sync_skills.py \
            --account-drift --repos "$GITHUB_WORKSPACE" > drift.json
          python3 scripts/account_zip_selection.py \
            --drift-report drift.json \
            --selection "$SELECTION" \
            --audit-latest ../eval-results/propagation/account/latest.json \
            --audit-status "$AUDIT_STATUS" \
            --event "$EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID"

  zip:
    needs: pick
    if: needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.pick.outputs.names) }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Build the upload payload
        # Built by the REAL uploader (`--prepare --zip-dir`), then unpacked, so
        # the artifact's members are exactly what an upload would carry -
        # `_include_in_zip`'s exclusions included. Re-walking the directory here
        # would be a second implementation free to drift from the first.
        # --yes: the runner is on a detached HEAD, which is not a dirty tree.
        env:
          SKILL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python3 plugins/adam-local/skills/sync-skills/sync_skills.py \
            --prepare --skill "$SKILL" --repos "$GITHUB_WORKSPACE" --yes \
            --zip-dir "$RUNNER_TEMP/zips" > /dev/null
          python3 - <<'PY'
          import os, pathlib, zipfile
          name = os.environ["SKILL"]
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zips" / f"{name}.zip"
          out = pathlib.Path("payload")
          out.mkdir()
          with zipfile.ZipFile(src) as zf:
              zf.extractall(out)
              print(f"{name}: {len(zf.namelist())} member(s)")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.name }}
          path: payload/
          # Stored, not deflated - matches zip_skill()'s ZIP_STORED, which its
          # docstring keeps "for maximum server compatibility".
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
