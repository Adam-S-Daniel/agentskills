name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Only skills-conformance benefits from a schedule. It clones the DEFAULT
  # BRANCHES of two other repos and audits them, so its verdict can go red with
  # no commit in this repo at all, and nothing else would ever notice. The other
  # four jobs read only this repo's own contents, so a scheduled run of them
  # could not tell anyone anything a push already did — they are gated off
  # `schedule` below. :17 rather than :00 because GitHub queues the whole
  # platform's cron on the hour and delays it.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  plugin-validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0 (2025-10-14)
        with:
          node-version: '22'
      - name: Install Claude Code
        # Pinned: the CLI version is sometimes the variable under test (see
        # docs/experiments/), so validation results must be reproducible rather
        # than silently re-baselined by whatever `latest` resolves to today.
        # 2.1.223 is the `stable` dist-tag, published 2026-08-05 — old enough to
        # satisfy this repo's 7-day dependency cooling-off as of 2026-08-14.
        run: npm install -g @anthropic-ai/claude-code@2.1.223
      - name: Validate marketplace and plugins
        run: claude plugin validate . --strict

  consistency:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
        with:
          # Full history — required by the skills.lock check below, NOT an
          # oversight. See the comment on that step before shortening this.
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0 (2025-11-24)
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        # pyyaml:     generate_readme_table.py parses SKILL.md frontmatter with it.
        # jsonschema: check_agent_plugins.py validates the root plugin.json
        #   manifests against the VENDORED Agent Plugins 1.0.0 schema using a real
        #   JSON Schema implementation — this repo forbids hand-rolling a
        #   validator where a library exists. 4.26.0 is the newest release
        #   (published 2026-01-07) and clears the 7-day dependency cooling-off
        #   many times over as of 2026-08-14.
        run: python3 -m pip install pyyaml==6.0.3 jsonschema==4.26.0
      - name: Check marketplace/filesystem consistency
        run: python3 scripts/check_consistency.py
      # Each bundle ships TWO manifests: the root plugin.json read by Agent
      # Plugins v1 clients (Codex, VS Code, Cursor, Copilot) and
      # .claude-plugin/plugin.json read by Claude Code, which is not a
      # conformant client. Both are shipped, so both can drift — this validates
      # the root ones against the pinned schema, checks that schema's sha256,
      # and cross-checks name/version between each pair.
      - name: Check Agent Plugins manifests
        run: python3 scripts/check_agent_plugins.py
      - name: Check README plugin table is up to date
        run: python3 scripts/generate_readme_table.py --check
      # Nothing else asserts that skills.lock is coherent, so without this it
      # can be hand-edited or drift — the same rot the conformance gate's
      # stale-waiver rule prevents on the other side.
      #
      # Needs `fetch-depth: 0` on the checkout above: --check reads the skill
      # content out of the git object store AT THE COMMIT THE LOCK PINS, and a
      # shallow clone contains only the tip, so the pinned commit is simply not
      # there. The failure that produces is confusing rather than obvious — it
      # surfaces as "cannot resolve ref <sha>" — so do not "optimise" the
      # checkout back to a shallow one.
      #
      # It asserts the lock is faithful to the ref it PINS, not that it pins
      # HEAD. That is deliberate: the lock pins an immutable commit and is
      # re-pinned as its own step, so it normally lags main, and in CI HEAD is
      # a merge commit that is never the pinned SHA.
      #
      # FEDERATED LOCKS NEED A SECOND PRECONDITION, of exactly the same kind.
      # A lock with a `sources` array draws on more than one registry, and this
      # step reads every source's content out of git — so each one needs a local
      # checkout, found at the sibling `../<repo-name>` or named with
      # `--source-repo '<bundles>=<path>'`. Neither flag is passed here (nothing
      # is: registry, ref, bundles and the whole `sources` array are inherited
      # from the lock), so the day skills.lock federates, BOTH steps below need
      # that source checked out beside the workspace — the way the
      # skills-conformance job already clones ../cms-platform — or they exit 1
      # with "no checkout at ...". This repo's lock has no `sources` today, which
      # makes that latent rather than fixed; scripts/test_generate_skills_lock.py
      # covers it in the pytest job, hermetically, from both directions
      # (test_the_ci_lock_checks_pass_on_a_federated_lock and
      # test_the_ci_lock_checks_say_how_to_fix_a_missing_source_checkout).
      - name: Check skills.lock is faithful to its pinned ref
        run: python3 scripts/generate_skills_lock.py --check
      # The step above is structurally BLIND to a stale pin, which is the
      # failure this repo actually has: add a skill to plugins/adam/skills/ and
      # the lock keeps describing an older commit, faithfully. --check stays
      # green, the new skill is delivered to no ephemeral surface at all, and
      # nothing says so — a silent no-op.
      #
      # --check-current closes that by comparing the bundle content AT THE
      # PINNED REF against the working tree. Distinct assertions, both wanted:
      # --check says the lock is honest, --check-current says it is current.
      #
      # Uses the same `fetch-depth: 0` as --check, and for the same reason: it
      # reads the pinned commit out of the object store, which a shallow clone
      # does not contain. It needs a federated source's checkout for the same
      # reason too — see the note on the step above.
      #
      # The ordering this implies, when a skill changes: change the bundle
      # content -> commit -> regenerate the lock, which pins THAT commit ->
      # commit the lock. The lock commit only touches skills.lock, so the
      # bundle content at the pinned commit stays current and this step is
      # green on the finished PR.
      - name: Check skills.lock still describes the current bundle
        run: python3 scripts/generate_skills_lock.py --check-current

  skills-conformance:
    runs-on: ubuntu-latest
    # Raised from the workflow-level default for the last step alone, which
    # opens a tracking issue when the SCHEDULED run fails. Only this job gets
    # it; the other four keep the read-only default.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0 (2025-11-24)
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        # markdown-it-py: the census parses SKILL.md bodies with a real
        # CommonMark parser rather than regex.
        run: python3 -m pip install pyyaml==6.0.3 markdown-it-py==4.2.0
      - name: Check out sibling registries for the cross-registry census
        # Cloned to ../<repo>, OUTSIDE the workspace checkout, so the trees being
        # audited never pollute the one under test — and that is exactly where
        # scripts/skills_registries.yml expects them by default. Both repos are
        # public, so a plain anonymous shallow clone is simpler than
        # actions/checkout here and needs no token scoping.
        run: |
          git clone --depth 1 --filter=blob:none --quiet https://github.com/Adam-S-Daniel/cms-platform.git ../cms-platform
          git clone --depth 1 --filter=blob:none --quiet https://github.com/Adam-S-Daniel/adamdaniel.ai.git ../adamdaniel.ai
      - name: Run the skills conformance census
        # Deliberately NO --private-registry, deviating from issue #55's checklist:
        # agentskills-private is a private repo and public-repo CI has no token to
        # clone it, so pointing the flag at a nonexistent path would only exercise
        # check_consistency.py's silent-SKIP branch — the exact "green-by-default
        # when the path is absent" anti-pattern umbrella issue #54 criticises in
        # platform-drift-guard.yml. Instead the census declares that registry as
        # `optional:` with a `reason:`, so its absence is REPORTED in this run's
        # output rather than passing silently.
        run: python3 scripts/check_skills.py
      # A scheduled failure is INVISIBLE: no PR goes red and nobody is
      # notified. This fleet has already lost a week to a daily audit running
      # red unwatched, because detect-only was the wrong contract for a job
      # nobody is looking at — so the scheduled run reports itself. Idempotent
      # on purpose: otherwise it would open a fresh issue every morning until
      # someone noticed.
      #
      # `gh` is preinstalled on the runner, so this needs no new `uses:` and
      # therefore no third-party pin and no cooling-off period. It passes
      # --repo rather than letting gh infer one from the workspace remote,
      # because failure() also fires when the CHECKOUT step is what failed,
      # leaving no git repo to infer from — the step guarding against silent
      # failure must not have a silent failure of its own.
      #
      # Everything the script reads arrives through env:, and the only workflow
      # expressions here are github.server_url/repository/run_id. Nothing off
      # the event payload and nothing the census printed is interpolated into
      # the run: body, where it would be echoed into a public log and evaluated
      # as shell.
      - name: File a tracking issue when the scheduled census fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Scheduled skills census is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/census-failure.md" <<EOF
          The scheduled skills census failed: $RUN_URL

          This job clones the DEFAULT BRANCHES of Adam-S-Daniel/cms-platform and
          Adam-S-Daniel/adamdaniel.ai and audits them, so its verdict can change
          with no commit in this repo at all. Look upstream first: the likely
          cause is a change in one of those repos rather than a change here.
          EOF
          # --search is full text, so it can return near-misses; the title is
          # re-checked EXACTLY before this concludes a duplicate already exists.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$ISSUE_TITLE in:title" --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/census-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/census-failure.md"
          fi

  pytest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
        with:
          # Needed by scripts/test_generate_skills_lock.py's dogfood test
          # (test_this_repos_own_lock_is_installable_end_to_end), which drives
          # the bootstrap hook against a file:// clone of THIS repo at the
          # commit skills.lock pins. A shallow clone does not contain that
          # commit — and the test then calls pytest.skip() rather than
          # failing, so the whole end-to-end install path would go SILENTLY
          # untested while the job stayed green. Measured: with `--depth 1`
          # that test skips; with full history it passes. Same reason the
          # consistency job above needs it. Do not shorten this.
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0 (2025-11-24)
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        # The scripts/ suites import the modules under test, so this job needs
        # their third-party deps, not just pytest:
        #   pyyaml + markdown-it-py -> check_skills.py
        #   jsonschema              -> check_agent_plugins.py
        # Pins are deliberately IDENTICAL to the consistency and
        # skills-conformance jobs above — the same module must not be tested
        # against a different version than it ships against.
        #
        # No git identity is configured on purpose: the lock tests set
        # user.name/user.email as REPO-LOCAL config on each fixture repo, so
        # they pass with no global identity available (measured with
        # GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null).
        run: python3 -m pip install pytest pyyaml==6.0.3 markdown-it-py==4.2.0 jsonschema==4.26.0
      # DELIBERATELY REPO-WIDE — do not narrow this back to one directory.
      # Three suites (scripts/test_check_skills.py, test_generate_skills_lock.py,
      # test_check_agent_plugins.py — 157 tests) once existed while this job ran
      # only the sync-skills directory, so they executed NOWHERE for three PRs.
      # Every target is a DIRECTORY rather than a file precisely so a new
      # scripts/test_*.py, or a new skills/<skill>/tests/ dir, is picked up with
      # no edit here and cannot silently go unrun again.
      #
      # The same failure then recurred one directory over, which is why there is
      # a third target: the 12 tests in
      # plugins/adam-local/skills/rename-pdfs/scripts/test_extract_pdf_context.py
      # ran NOWHERE, sitting in a skill's scripts/ dir and so matching neither
      # of the first two. The reason recorded here previously — that they need
      # the heavy optional `pypdf` — was wrong: all 12 exercise find_dates(), a
      # pure regex date parser, and not one of them imports pypdf. What actually
      # kept them out was an import-time sys.exit(2) in extract_pdf_context.py's
      # `except ImportError` for pypdf, which does not fail a single file — it
      # aborts the entire run with `INTERNALERROR ... caught unexpected
      # SystemExit`, measured by widening the glob without touching it. That
      # exit now happens in main(), so nothing here needs pypdf: do not add it
      # to the pip line above.
      #
      # This job is also where the FEDERATED (multi-registry) lock path is
      # covered — the lock steps in the consistency job cannot cover it, because
      # this repo's own skills.lock has no `sources` yet.
      # scripts/test_generate_skills_lock.py builds `file://` fixture registries
      # in tmp, generates a federated lock against them, and runs `--check`,
      # `--check-current` and the bootstrap hook end to end (SKILLS_BOOTSTRAP_FORCE
      # with a scratch HOME) — no network, no sibling clone. Deliberately a test
      # rather than a separate CI job: the fixture registries, the scratch-HOME
      # discipline (`_run_hook` REFUSES to run without a tmp home) and the verdict
      # parsing all already exist there, so a job would be a second, drifting copy
      # of them; and this step targets a DIRECTORY, so a new federated test is
      # picked up with no edit here — which a hand-listed job is exactly what
      # this comment's opening paragraph says goes wrong.
      - name: Run every test suite in the repo
        run: python3 -m pytest scripts/ plugins/*/skills/*/tests/ plugins/*/skills/*/scripts/ -q

  # The same suites on Windows, because until #98 they could not run there at
  # all — 72 failures, every one of them a platform fault rather than a real
  # defect, on the machine most of these skills exist to run on. Three of the
  # causes were in the SHIPPED code, not the tests: the bootstrap hook framed
  # its python<->bash handoff with os.linesep and so reported a bogus "framing
  # error" on every Windows session, generate_skills_lock.py digested a
  # CRLF rendering of the pinned ref, and the vendored schema failed its own
  # integrity check on every Windows clone. A Linux-only CI could not see any
  # of that, and #92 was opened because of a Windows failure this lane is what
  # would have caught.
  #
  # A SEPARATE JOB rather than a `matrix` on the one above, deliberately: a
  # matrix renames the existing check to `pytest (ubuntu-latest)`, and a
  # required status check that changes context name blocks every open PR until
  # the ruleset in repo-settings is updated to match. This adds a context, it
  # renames none.
  #
  # That hypothetical is now this job's own situation: `pytest-windows` IS a
  # required status check on this repo's default branch (declared in
  # repo-settings' fleet.yml, the only one in that fleet). So the job id below
  # is a published contract, and this job must stay free of anything that
  # renames its context — a `name:`, a `matrix` — or that could leave the
  # context unreported on a PR: a `paths:` filter on the trigger, or a
  # `concurrency:` block at either level, which lets a cancelled run win the
  # sha and wedge the merge API. scripts/test_ci_workflow.py asserts all of
  # that against this file, parsed.
  pytest-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, not pwsh. The pytest targets below are GLOBS, and pwsh
        # neither expands them nor passes them through in a form pytest can
        # use — the run would collect nothing and pass. It also keeps this
        # step byte-identical to the ubuntu one above.
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
        with:
          # Same reason as the ubuntu job: without full history the dogfood
          # test SKIPS rather than fails, and the end-to-end install path goes
          # silently untested while this job stays green.
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0 (2025-11-24)
        with:
          python-version: '3.12'
      # Pins identical to every other job here — see the ubuntu job for why.
      - run: python3 -m pip install pytest pyyaml==6.0.3 markdown-it-py==4.2.0 jsonschema==4.26.0
      # `core.autocrlf` is true by default on Windows runners. .gitattributes
      # (`* -text`) is what keeps the checkout byte-identical to Linux's, and
      # every digest in skills.lock depends on that holding — so assert it
      # here rather than discovering it as an unexplained hash mismatch.
      - name: Assert the checkout was not line-ending mangled
        run: |
          if grep -qU $'\r' README.md; then
            echo "::error::README.md checked out with CRLF — .gitattributes did not apply."
            exit 1
          fi
      - name: Run every test suite in the repo
        run: python3 -m pytest scripts/ plugins/*/skills/*/tests/ plugins/*/skills/*/scripts/ -q

  shellcheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          # DELIBERATELY REPO-WIDE — do not narrow this back to `setup.sh` plus
          # `find plugins`. That pair matched .claude/hooks/skills-bootstrap.sh
          # NEITHER way (it is not setup.sh and it is not under plugins/), so the
          # riskiest bash in the repo — a SessionStart hook that runs with no
          # approval prompt on every ephemeral surface and turns skills.lock
          # fields into git remote URLs and filesystem paths — was never linted
          # here at all. Same reasoning as the pytest job above: the target is a
          # TREE, not a list of paths, so a new *.sh added anywhere is picked up
          # with no edit here and cannot silently go unchecked.
          #
          # The file list is printed first so the run log shows what was covered.
          # This step's whole failure mode was coverage nobody could see.
          #
          # No `--no-run-if-empty`, on purpose: if the find ever matches nothing,
          # shellcheck exits 1 ("No files specified") instead of passing on an
          # empty set — a green step that checked nothing is the bug being fixed.
          #
          # -S error: two SC2088 (tilde-in-quotes) *warnings* exist today in
          # plugins/adam-local/skills/migrate-claude-memory/scripts/memory-migrate.sh
          # (lines 90, 93) — pre-existing, out of scope for this change. Errors still fail CI.
          #
          # Extensionless shell files matched NEITHER find when this step
          # globbed only '*.sh'. A git hook cannot carry an extension, so
          # hooks/pre-push - which this repo's own setup.sh installs as a
          # global pre-push hook in every clone - was linted nowhere at all.
          # Same coverage bug as the paragraph above, one layer down. Match
          # them by SHEBANG rather than by name, and keep them in their own
          # list so they can be held to a stricter bar without moving the
          # bar for the existing *.sh files.
          hooks=/tmp/shellcheck-extensionless.txt
          find . -path ./.git -prune -o -type f ! -name '*.*' -print0 > /tmp/noext.z
          while IFS= read -r -d '' f; do
            case "$(head -n 1 "$f")" in
              '#!'*sh|'#!'*sh[[:space:]]*) echo "$f" ;;
            esac
          done < /tmp/noext.z | sort -u > "$hooks"

          targets=/tmp/shellcheck-targets.txt
          find . -path ./.git -prune -o -name '*.sh' -print > /tmp/sh.txt
          cat /tmp/sh.txt "$hooks" | sort -u > "$targets"

          echo "shellcheck will lint:"
          cat "$targets"
          xargs -a "$targets" shellcheck -S error

          # The extensionless hooks additionally at WARNING level. SC2034
          # (assigned but never used) is a warning, so -S error alone would
          # have kept missing the pre-push defect even once the file was in
          # scope: the lane missed it twice over. Deliberately NOT applied
          # to *.sh - the repo is not warning-clean there (the SC2088s noted
          # above), and a lane that fails on unrelated pre-existing warnings
          # gets muted rather than fixed.
          if [ -s "$hooks" ]; then
            echo "shellcheck (warning level, extensionless hooks only):"
            cat "$hooks"
            xargs -a "$hooks" shellcheck -S warning
          fi
