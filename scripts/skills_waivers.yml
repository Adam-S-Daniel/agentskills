# Declared exemptions for scripts/check_skills.py (agentskills#55).
#
# Every entry here is a KNOWN defect or a KNOWN duplication that the census has
# seen and that we have consciously decided not to fail the build on *yet*. The
# point of the file is that nothing is hidden: a waived finding is still printed
# in every run, under WAIVED, with this reason and issue attached.
#
# Two properties make this safe to have at all:
#
#   1. A waiver that matches NO finding in a run is itself an error
#      ("stale-waiver") and fails the build. So waivers cannot rot: the census
#      forces the deletion of any waiver whose finding has stopped being
#      reported, which is what makes this file evidence rather than a wishlist.
#   2. Nothing here is waived because it is inconvenient. Each entry names the
#      repo that must change; none of these defects can be fixed from
#      agentskills, which is the only reason they are waived rather than fixed.
#
# Adding a waiver for a defect in THIS repo requires a reason better than "it is
# red" — see the wj-next-break entries below, which carry an explicit owner
# decision (ADR 0002).
#
# If you add a duplicate waiver, PIN ITS VERDICT via `match:`. Without that pin a
# waiver keyed on klass+registry+basename keeps matching after a mirror silently
# diverges into a fork, and the census reports OK — verified, it did. With the
# pin, editing one copy of a mirrored skill breaks the match, so the finding
# fires AND the waiver goes stale: two independent signals for the drift this
# gate exists to catch.
#
# ---------------------------------------------------------------------------
# What property 1 actually collected — agentskills#54, closed 2026-08-14
#
# This header used to describe that moment in the future tense: "when
# cms-platform#250 retires the vendored mirror, all fourteen `mirror`
# declarations below stop matching and CI will force their deletion — the census
# becomes the thing that proves the mirror is gone." The mirror was duly retired
# (cms-platform v0.1.83 dropped the rsync transport and fixed its skill defects;
# adamdaniel.ai#3109 deleted its 15 mirrored skills), and the census did force
# the deletion. But it reported TWENTY-ONE stale waivers, not fourteen. All 21
# were deleted in one pass, and the two wj-next-break entries below are now the
# entire file.
#
# The forecast was low because it modelled only one way a waiver can die — the
# duplicate being REMOVED. A waiver goes stale whenever its finding stops being
# reported, and *fixing* the waived defect does that just as surely as deleting
# the file that carried it. The seven the forecast missed:
#
#   * 3 cms-platform defect waivers (2 dangling-payload-ref, 1 yaml-parse) —
#     stale because cms-platform FIXED those skills. Nothing was deleted there;
#     the defect simply stopped existing, which retires its waiver all the same.
#   * 3 adamdaniel.ai defect waivers — the same three defects downstream, stale
#     because the mirrored files naming them are gone.
#   * 1 `workflow-path-audit` fork waiver — where the old forecast was wrong in
#     the other direction. It expected only the `mirror` rows to go stale, but
#     cms-platform deleted its own copy of that skill too, leaving the basename
#     in a single registry with no duplicate left to declare. Retiring the
#     mirror alone would have left this waiver still matching.
#
# The generalisation worth keeping: a waiver asserts that one specific finding is
# STILL BEING REPORTED, and says nothing about why. Its lifetime therefore tracks
# the finding, not whichever remediation you happen to be waiting on — so
# forecasting from the planned fix undercounts, and property 1 is what gets the
# number right instead of the prose above it.
# ---------------------------------------------------------------------------

waivers:
  # --- agentskills: descoped by the owner -----------------------------------
  # `wj-next-break` instructs the agent to run two scripts that have never
  # existed in its directory. Owner directive, 2026-08-14: "Forget the WJ bell
  # schedule skill" — do not research the bell times, do not write the payload.
  # The skill is NOT deleted: it also exists in the claude.ai account store,
  # which has no delete API, so removing it from git would re-orphan the account
  # copy — exactly the unversioned-orphan problem PR #62 just fixed. It stays
  # under version control, visibly broken, tracked by #63.
  - klass: dangling-payload-ref
    registry: agentskills
    path: plugins/adam-local/skills/wj-next-break/SKILL.md
    match: "scripts/next_break.py"
    reason: >-
      Descoped by owner directive 2026-08-14. Skill retained in git so the
      claude.ai account copy stays version-controlled (no account delete API).
    issue: https://github.com/Adam-S-Daniel/agentskills/issues/63
  - klass: dangling-payload-ref
    registry: agentskills
    path: plugins/adam-local/skills/wj-next-break/SKILL.md
    match: "scripts/test_next_break.py"
    reason: >-
      Descoped by owner directive 2026-08-14. Skill retained in git so the
      claude.ai account copy stays version-controlled (no account delete API).
    issue: https://github.com/Adam-S-Daniel/agentskills/issues/63
